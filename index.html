<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Altered Run</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
    #game { position: fixed; inset: 0; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0b1020; color: #e8ecff;
      font: 600 20px system-ui, sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #8fa3ff; font: 600 16px system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="loading">Loading…</div>
  <div id="game"></div>
  <div id="rotate"><div>↻<br />Rotate your phone to landscape</div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
